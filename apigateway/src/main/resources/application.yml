server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: userservice-docs
              uri: http://userservice:8080
              order: 0
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs

            - id: authservice-docs
              uri: http://authservice:8080
              order: 1
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

            - id: orderservice-docs
              uri: http://orderservice:8080
              order: 2
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/v3/api-docs, /v3/api-docs

            - id: paymentservice-docs
              uri: http://paymentservice:8080
              order: 3
              predicates:
                - Path=/payment-service/v3/api-docs
              filters:
                - RewritePath=/payment-service/v3/api-docs, /v3/api-docs

            - id: userservice
              uri: http://userservice:8080
              order: 10
              predicates:
                - Path=/user-service/**
              filters:
                - RewritePath=/user-service/(?<segment>.*), /${segment}

            - id: authservice
              uri: http://authservice:8080
              order: 11
              predicates:
                - Path=/auth-service/**
              filters:
                - RewritePath=/auth-service/(?<segment>.*), /${segment}

            - id: orderservice
              uri: http://orderservice:8080
              order: 12
              predicates:
                - Path=/order-service/**
              filters:
                - RewritePath=/order-service/(?<segment>.*), /${segment}

            - id: paymentservice
              uri: http://paymentservice:8080
              order: 13
              predicates:
                - Path=/payment-service/**
              filters:
                - RewritePath=/payment-service/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    urls:
      - name: userservice
        url: /user-service/v3/api-docs
      - name: authservice
        url: /auth-service/v3/api-docs
      - name: orderservice
        url: /order-service/v3/api-docs
      - name: paymentservice
        url: /payment-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true